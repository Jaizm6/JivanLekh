<html lang="en"><head>

<style>
:root{--bg:#f6f1f8;--side:#ece4f0;--surf:#fdfbfe;--ink:#241a2e;--mut:#7d7088;--acc:#7a4bb5;--accs:color-mix(in srgb,var(--acc) 13%,transparent);--line:#e3d9ea;--hov:#ebe2f1;--danger:#c4483d;--sh:0 10px 32px rgba(40,20,60,.16);

:root[data-theme=dark]{--bg:#111513;--side:#0d100e;--surf:#171c19;--ink:#e6ece7;--mut:#8d998f;--acc:#4cc38a;--line:#252c27;--hov:#202722;--sh:0 10px 32px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{--sw:228px;--lw:284px;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
body.sc{--sw:58px}body.lc{--lw:0px}
button,input,textarea,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;border-radius:8px;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}[hidden]{display:none!important}
[data-t]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

#app{display:grid;grid-template-columns:var(--sw) var(--lw) 1fr;height:100%}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;color:var(--mut);flex:none}.ib:hover{background:var(--hov);color:var(--ink)}

.nbr{display:flex;align-items:center}.nbr .nav{flex:1;width:auto}.nbr .more{opacity:0;width:22px;height:22px;display:grid;place-items:center;color:var(--mut);flex:none}.nbr:hover .more,.nbr .more:focus-visible{opacity:1}@media (hover:none){.nbr .more{opacity:.7}}
.tagbox{max-height:200px;overflow:auto}.tagq{margin:2px 0 4px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;outline:0}

.trow{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line)}.trow small{color:var(--mut);white-space:nowrap}.trow .tname{flex:1;min-width:0;text-align:left}

.bar button{padding:0;min-width:30px;height:30px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;flex:none}.bar button:hover{background:var(--hov);color:var(--ink)}.bar button.on{color:var(--acc);background:var(--accs)}
.bar select{background:var(--bg);border:0;border-radius:8px;padding:5px 8px;max-width:150px;flex:none}
.back,.lshow{display:none!important}body.lc .lshow{display:inline-flex!important}

.fmt{display:flex;gap:1px;padding:5px 16px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}.fmt button{min-width:32px;height:30px;color:var(--mut);flex:none;padding:0 6px}.fmt button:hover{background:var(--hov);color:var(--ink)}.fmt svg{width:16px;height:16px}.fmt i{width:1px;background:var(--line);margin:5px 5px;flex:none}
.panes{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr)}.pane{overflow:auto;padding:18px 20px 60px;min-width:0}.wrap{max-width:var(--ew,none);margin:0 auto}
#title{width:100%;border:0;background:none;outline:0;font:700 28px/1.2 var(--ui);padding:0 0 8px}

.prev{font-family:var(--serif);font-size:var(--es);line-height:var(--lh)}#rte{outline:0;min-height:50vh}
.prev h1,.prev h2,.prev h3{font-family:var(--ui);line-height:1.25;margin:1.1em 0 .4em}

.prev blockquote{margin:1em 0;padding-left:14px;border-left:3px solid var(--acc);color:var(--mut)}.prev blockquote.co{border:0;background:var(--accs);color:var(--ink);padding:10px 14px;border-radius:10px}
.prev a{color:var(--acc)}.prev a[href^=":/"]{background:var(--accs);padding:0 6px;border-radius:6px;text-decoration:none;font-family:var(--ui);font-size:.9em;font-weight:500;cursor:pointer}

.prev table{border-collapse:collapse;margin:1em 0;width:100%}.prev td,.prev th{border:1px solid var(--line);padding:6px 10px;min-width:60px}.prev th{background:var(--bg);font-family:var(--ui);text-align:left}
.prev hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}.prev img{max-width:100%;border-radius:8px}.prev mark{background:#ffe58a;color:#1c2420;padding:0 2px;border-radius:3px}
.prev table.nh thead{display:none}.prev td,.prev th{height:2em}.tg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:18px 0 0;color:var(--mut);font-size:12.5px}.bl button{background:var(--accs);color:var(--acc);padding:1px 8px}
.stat{border-top:1px solid var(--line);padding:5px 16px;color:var(--mut);font-size:12px;display:flex;gap:16px;flex:none}
/* notebooks */
.ph{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);flex:none}.ph h2{margin:0;font-size:17px;flex:1}.pg{flex:1;overflow:auto;padding:20px 20px 70px;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.nbc{position:relative;aspect-ratio:3/4;border-radius:6px 14px 14px 6px;overflow:hidden;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);background:var(--hov);transition:transform .15s,box-shadow .15s}.nbc:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.nbc .cv{position:absolute;inset:0;background-size:cover;background-position:center}.nbc::after{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12) 60%,transparent);pointer-events:none}
.nbc .lb{position:absolute;left:14px;right:10px;bottom:10px;background:rgba(255,255,255,.92);color:#1b221e;border-radius:10px;padding:6px 10px;z-index:1}.nbc .lb b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}.nbc .lb small{color:#5d6a61;font-size:11.5px}
.nbc .more{position:absolute;top:8px;right:8px;z-index:2;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.88);color:#1b221e;display:grid;place-items:center;opacity:0}.nbc:hover .more,.nbc .more:focus-visible{opacity:1}@media (hover:none){.nbc .more{opacity:1}}
.nbc.add{display:grid;place-items:center;background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--mut)}.nbc.add:hover{border-color:var(--acc);color:var(--acc);transform:none}.nbc.add::after{display:none}
.cvt{display:inline-block;width:15px;height:20px;border-radius:3px 5px 5px 3px;background-size:cover;background-position:center;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.cvp{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;max-height:44vh;overflow:auto;padding:6px 4px}.cvp button{aspect-ratio:3/4;border-radius:4px 8px 8px 4px;background-size:cover;background-position:center;box-shadow:0 1px 4px rgba(0,0,0,.28)}.cvp button.on{outline:3px solid var(--acc);outline-offset:2px}
/* popovers & dialogs */
#sl,#cm,#lp,#tip,#hint,#toast{position:fixed}
#sl,#cm{z-index:50;background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:4px;overflow:auto}
#sl{z-index:20;width:210px;max-height:260px}#cm{min-width:190px;max-width:260px;max-height:70vh}
#sl button,#cm button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:8px}#sl button:hover,#cm button:hover{background:var(--hov)}#sl button.on{background:var(--accs);color:var(--acc)}#cm .dg{color:var(--danger)}#cm hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
#lp{z-index:25;display:flex;flex-direction:column;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:10px;width:min(280px,92vw)}
.lf span{display:block;color:var(--mut);font-size:11.5px;margin-bottom:2px}.lf input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:0}.lf input:focus{border-color:var(--acc)}
.lr{display:flex;gap:6px}.lr button{flex:1;padding:6px;background:var(--hov)}.lr .p{background:var(--acc);color:#fff;font-weight:600}.lr button[data-lk=rm]{color:var(--danger)}
#bh{position:fixed;z-index:15;width:18px;height:24px;color:var(--mut);display:grid;place-items:center;padding:0}#bh:hover{background:var(--hov)}
#tip,#hint{z-index:60;background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:8px;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:min(320px,92vw)}#hint{white-space:normal;width:max-content}#tip.on,#hint.on{opacity:1}#tip span{opacity:.75}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--surf);color:var(--ink);padding:0;width:min(560px,94vw);max-height:88vh}dialog::backdrop{background:rgba(0,0,0,.4)}
.dh{padding:18px 22px 6px;font-size:18px;font-weight:700}.db{padding:8px 22px 18px;overflow:auto;max-height:66vh}.row{display:flex;gap:8px;justify-content:flex-end;padding:0 22px 18px;flex-wrap:wrap}
.btn{padding:8px 14px;background:var(--hov);border-radius:10px}.btn.p{background:var(--acc);color:#fff;font-weight:600}
.fld{display:block;margin:10px 0}.fld span{display:block;color:var(--mut);font-size:12.5px;margin-bottom:3px}.fld input,textarea#bk{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.prov{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}.prov button{border:1.5px solid var(--line);padding:10px 12px;text-align:left;border-radius:12px}.prov button.on{border-color:var(--acc);background:var(--accs)}.prov small{display:block;color:var(--mut)}
.note{background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--mut);font-size:12.5px;margin-top:10px}.rowb{display:flex;gap:6px;margin-top:6px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.tog small{color:var(--mut)}.tog input[type=checkbox]{accent-color:var(--acc);width:20px;height:20px}
.lbl{display:block;color:var(--mut);font-size:12px;margin:6px 0 2px}.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}.seg button{padding:6px 12px;border:1.5px solid var(--line);border-radius:10px}.seg button.on{border-color:var(--acc);background:var(--accs);color:var(--acc);font-weight:600}

.lk input{width:100%;text-align:center;font-size:20px;letter-spacing:.35em;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px;outline:0}.lk .btn{width:100%;padding:10px}.lk small{color:var(--danger);min-height:1em}
#bnav{display:none}

@media (max-width:900px){#app{grid-template-columns:1fr;height:calc(100% - 62px - env(safe-area-inset-bottom,0px))}
#side{position:fixed;inset:0 auto 0 0;width:min(260px,80vw);z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 24px rgba(0,0,0,.25)}body.menu #side{transform:none}

<body data-v="list">
<div id="app">
<aside id="side"></aside>
<section id="list">

 <label class="search"><svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg><input id="q" placeholder="Search notes" aria-label="Search notes"></label></div>
 <div id="items"></div>
</section>

</div>

<script>
